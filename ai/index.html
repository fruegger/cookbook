<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dinner für zwei</title>
    <link rel="stylesheet" href="css/cookbook.css">
</head>
<body>
<header class="topnav">
    <div class="brand"><a href="index.html">Dinner für zwei</a></div>
    <nav>
        <a href="recipes.html">Rezepte</a>
        <a href="ingredients.html">Zutaten</a>
        <a href="books.html">Bücher</a>
        <a href="editor.html">Editor</a>
    </nav>
    <div id="lang-switch" class="langswitch"></div>
</header>

<section class="title-block">
    <h1 id="brand-heading">Dinner für zwei</h1>
    <p class="tagline" id="home-tagline">Ein digitales Kochbuch — Rezepte, Zutaten und persönliche Bücher.</p>
</section>

<!-- Plain welcome page: three doorways into the site. No dedication is
     rendered here — dedications now belong to individual books
     (book.html?id=…), not to the homepage. -->
<div class="index-grid" id="home-grid"></div>

<script src="js/cookbook.js"></script>
<script>
    let lang = localStorage.getItem('cookbook-lang') || 'de';

    const DOORS = [
      { href: 'recipes.html',     navKey: 'navRecipes',     tagKey: 'tagRecipes' },
      { href: 'ingredients.html', navKey: 'navIngredients', tagKey: 'tagIngredients' },
      { href: 'books.html',       navKey: 'navBooks',       tagKey: 'tagBooks' }
    ];

    function render() {
      const t = window.cookbook.t;
      document.getElementById('brand-heading').textContent = t('brandName', lang);
      document.getElementById('home-tagline').textContent = t('tagHome', lang);

      const grid = document.getElementById('home-grid');
      grid.innerHTML = DOORS.map(d => `
        <a class="recipe-card" href="${d.href}">
          <div class="thumb" style="background:var(--paper-deep);display:flex;align-items:center;justify-content:center;padding:1.5rem;text-align:center;color:var(--ink-soft);font-family:var(--serif);font-style:italic;font-size:1.05rem;line-height:1.4">${t(d.tagKey, lang)}</div>
          <h2 class="name">${t(d.navKey, lang)}</h2>
        </a>
      `).join('');

      window.cookbook.applyChrome(lang);
      document.title = t('brandName', lang);
    }

    function renderLangSwitch() {
      const el = document.getElementById('lang-switch');
      el.innerHTML = window.cookbook.LANGS.map(l => `
        <button class="${l===lang?'active':''}" data-lang="${l}">${l.toUpperCase()}</button>
      `).join('');
      el.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
        lang = b.dataset.lang;
        localStorage.setItem('cookbook-lang', lang);
        render();
        renderLangSwitch();
      }));
    }

    render();
    renderLangSwitch();
</script>
</body>
</html>
