<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dinner für zwei</title>
  <link rel="stylesheet" href="css/cookbook.css">
</head>
<body>
  <header class="topnav print-hide">
    <div class="brand"><a href="index.html">Dinner für zwei</a></div>
    <nav>
      <a href="recipes.html">Rezepte</a>
      <a href="ingredients.html">Zutaten</a>
      <a href="editor.html">Editor</a>
      <a href="#" onclick="window.print();return false;">Drucken</a>
    </nav>
    <div id="lang-switch" class="langswitch"></div>
  </header>

  <main id="dedication-root"></main>

  <script>
    const LANGS = ['de','en','fr','it'];
    let lang = localStorage.getItem('cookbook-lang') || 'de';
    let data = null;

    function pick(field) {
      if (!field) return '';
      if (field[lang] && (Array.isArray(field[lang]) ? field[lang].length : field[lang])) return field[lang];
      for (const l of LANGS) if (field[l] && (Array.isArray(field[l]) ? field[l].length : field[l])) return field[l];
      return '';
    }
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    async function load() {
      const res = await fetch('data/dedication.json');
      data = await res.json();
      render();
      renderLangSwitch();
    }

    function render() {
      const title = pick(data.title);
      const tagline = pick(data.tagline);
      const salutation = pick(data.salutation);
      const body = (data.body && data.body[lang] && data.body[lang].length) ? data.body[lang] : (data.body?.de || []);
      const signoff = pick(data.signoff);

      const root = document.getElementById('dedication-root');
      root.innerHTML = `
        <article class="recipe-page dedication-page">
          <h1 class="recipe-title">${escapeHtml(title)}</h1>
          ${salutation ? `<p class="recipe-subtitle">${escapeHtml(salutation)}</p>` : ''}

          <div class="mood">
            ${body.map(p => `<p>${escapeHtml(p)}</p>`).join('')}
            ${signoff ? `<p class="dedication-signoff">${escapeHtml(signoff)}</p>` : ''}
          </div>

          <p class="dedication-enter print-hide">
            <a href="recipes.html">Zu den Rezepten →</a>
          </p>
        </article>
      `;
      document.title = title;
    }

    function renderLangSwitch() {
      const el = document.getElementById('lang-switch');
      el.innerHTML = LANGS.map(l => {
        const has = data.title[l] && data.title[l].length;
        return `<button class="${l===lang?'active':''}" ${has?'':'disabled'} data-lang="${l}">${l.toUpperCase()}</button>`;
      }).join('');
      el.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
        if (b.disabled) return;
        lang = b.dataset.lang;
        localStorage.setItem('cookbook-lang', lang);
        render();
        renderLangSwitch();
      }));
    }

    load();
  </script>
</body>
</html>
