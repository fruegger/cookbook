<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rezepte — Dinner für zwei</title>
    <link rel="stylesheet" href="css/cookbook.css">
</head>
<body>
<header class="topnav">
    <div class="brand"><a href="index.html">Dinner für zwei</a></div>
    <nav>
        <a href="recipes.html">Rezepte</a>
        <a href="ingredients.html">Zutaten</a>
        <a href="editor.html">Editor</a>
    </nav>
    <div id="lang-switch" class="langswitch"></div>
</header>

<section class="title-block">
    <h1 id="brand-heading">Dinner für zwei</h1>
    <p class="tagline" id="recipes-tagline">Rezepte, gesammelt und mit Liebe weitergegeben.</p>
</section>

<div class="cat-filter" id="cat-filter"></div>

<div class="index-grid" id="grid"></div>

<script src="js/cookbook.js"></script>
<script>
    const CATS = ['all', 'entree', 'main', 'dessert', 'side', 'soup', 'breakfast','bread','sauce'];

    let activeCat = 'all';
    let lang = localStorage.getItem('cookbook-lang') || 'de';
    let registry = null;

    function catLabel(c) {
      if (c === 'all') return window.cookbook.t('allCategoriesLabel', lang);
      return window.cookbook.CAT_LABELS[lang]?.[c] || c;
    }

    async function load() {
      const res = await fetch('data/recipes.json');
      registry = await res.json();
      renderFilter();
      renderGrid();
      renderLangSwitch();
      applyPageChrome();
    }

    function applyPageChrome() {
      window.cookbook.applyChrome(lang);
      document.getElementById('brand-heading').textContent = window.cookbook.t('brandName', lang);
      document.getElementById('recipes-tagline').textContent = window.cookbook.t('tagRecipes', lang);
    }

    function renderFilter() {
      const el = document.getElementById('cat-filter');
      el.innerHTML = CATS.map(c => `
        <button class="${c === activeCat ? 'active' : ''}" data-cat="${c}">${catLabel(c)}</button>
      `).join('');
      el.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
        activeCat = b.dataset.cat;
        renderFilter();
        renderGrid();
      }));
    }

    function renderGrid() {
      const grid = document.getElementById('grid');
      const items = registry.recipes.filter(r => activeCat === 'all' || r.category === activeCat);
      grid.innerHTML = items.map(r => {
        const t = r.title[lang] || r.title.de || '';
        const cat = window.cookbook.CAT_LABELS[lang]?.[r.category] || r.category;
        return `
          <a class="recipe-card" href="${r.href}">
            <div class="thumb"><img src="${r.thumb}" alt=""></div>
            <div class="cat">${cat}</div>
            <h2 class="name">${t}</h2>
          </a>
        `;
      }).join('') || `<p style="grid-column:1/-1;text-align:center;color:var(--ink-faint)">${window.cookbook.t('noRecipesInCategory', lang)}</p>`;
    }

    function renderLangSwitch() {
      const el = document.getElementById('lang-switch');
      el.innerHTML = ['de','en','fr','it'].map(l => `
        <button class="${l===lang?'active':''}" data-lang="${l}">${l.toUpperCase()}</button>
      `).join('');
      el.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
        lang = b.dataset.lang;
        localStorage.setItem('cookbook-lang', lang);
        renderFilter();
        renderGrid();
        renderLangSwitch();
        applyPageChrome();
      }));
    }

    load();
</script>
</body>
</html>
