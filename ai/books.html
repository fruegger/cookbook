<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bücher — Dinner für zwei</title>
  <link rel="stylesheet" href="css/cookbook.css">
</head>
<body>
  <header class="topnav">
    <div class="brand"><a href="index.html">Dinner für zwei</a></div>
    <nav>
      <a href="recipes.html">Rezepte</a>
      <a href="ingredients.html">Zutaten</a>
      <a href="books.html">Bücher</a>
      <a href="editor.html">Editor</a>
    </nav>
    <div id="lang-switch" class="langswitch"></div>
  </header>

  <section class="title-block">
    <h1 id="books-heading">Bücher</h1>
    <p class="tagline" id="books-tagline">Personalisierte Kochbücher — eine Zueignung, ausgewählte Rezepte.</p>
  </section>

  <div class="index-grid" id="grid"></div>

  <script src="js/cookbook.js"></script>
  <script>
    let lang = localStorage.getItem('cookbook-lang') || 'de';
    let registry = null;

    async function load() {
      registry = await window.cookbook.loadBookRegistry();
      renderGrid();
      renderLangSwitch();
      applyPageChrome();
    }

    function applyPageChrome() {
      window.cookbook.applyChrome(lang);
      document.getElementById('books-heading').textContent = window.cookbook.t('navBooks', lang);
      document.getElementById('books-tagline').textContent = window.cookbook.t('tagBooks', lang);
    }

    function renderGrid() {
      const grid = document.getElementById('grid');
      const items = registry.books || [];
      grid.innerHTML = items.map(b => {
        const title = b.title[lang] || b.title.de || b.id;
        return `
          <a class="recipe-card" href="book.html?id=${encodeURIComponent(b.id)}">
            <div class="thumb" style="background:var(--paper-deep);display:flex;align-items:center;justify-content:center;color:var(--ink-faint);font-size:.75rem;letter-spacing:.15em;text-transform:uppercase">${window.cookbook.t('navBooks', lang)}</div>
            <h2 class="name">${title}</h2>
          </a>
        `;
      }).join('') || `<p style="grid-column:1/-1;text-align:center;color:var(--ink-faint)">${window.cookbook.t('noBooksYet', lang)}</p>`;
    }

    function renderLangSwitch() {
      const el = document.getElementById('lang-switch');
      el.innerHTML = ['de','en','fr','it'].map(l => `
        <button class="${l===lang?'active':''}" data-lang="${l}">${l.toUpperCase()}</button>
      `).join('');
      el.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
        lang = b.dataset.lang;
        localStorage.setItem('cookbook-lang', lang);
        renderGrid();
        renderLangSwitch();
        applyPageChrome();
      }));
    }

    load();
  </script>
</body>
</html>
